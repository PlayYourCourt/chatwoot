# Production pipeline for the PlayYourCourt Chatwoot fork.
#   push to `main`  -> build image from docker/Dockerfile (enterprise stripped) -> push to GHCR -> deploy to the Droplet
#   tag v*          -> build + push only (release archive)
#   workflow_dispatch -> same as a push to the chosen branch; tick "deploy" to roll it out
#
# `develop` mirrors upstream chatwoot/chatwoot and is never deployed. Release = merge develop (or a
# feature branch) into main. Rollback = re-run this workflow from the previous good commit.
#
# The deploy job runs on a self-hosted runner installed on the Droplet as the user that owns the checkout
# (deploy/README.md "Deploying"); no secrets or inbound SSH are needed. The runner's .env may set
# DROPLET_APP_DIR when the checkout is not /opt/chatwoot.

name: Build and deploy PYC Chatwoot

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the Droplet after building
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/playyourcourt/chatwoot   # lowercase: Docker rejects uppercase repository names on pull

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Image tags
        id: vars
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    # A self-hosted runner installed on the Droplet (deploy/README.md "Deploying"): it polls GitHub, so the
    # Droplet needs no inbound SSH from the internet.
    runs-on: [self-hosted, droplet]
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy ${{ needs.build.outputs.sha_tag }} on the Droplet
        run: |
          set -euo pipefail
          cd "${DROPLET_APP_DIR:-/opt/chatwoot}"
          git fetch --quiet origin main
          git checkout --quiet --force "${{ github.sha }}"
          deploy/bin/deploy.sh "${{ env.IMAGE }}:${{ needs.build.outputs.sha_tag }}"
