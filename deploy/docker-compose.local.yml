# Local stack that mirrors production: the same image build, Postgres with pgvector, Redis, and
# Mailhog for outbound email. Run from the repo root:
#   docker compose -f deploy/docker-compose.local.yml up --build
# First run: deploy/bin/local-setup.sh

name: chatwoot

x-base: &base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: chatwoot-pyc:local
  env_file: .env.local
  environment:
    - NODE_ENV=production
    - RAILS_ENV=production
    - INSTALLATION_ENV=docker
  volumes:
    - storage_data:/app/storage

services:
  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
      - mailhog
    ports:
      - '127.0.0.1:3000:3000'
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: unless-stopped

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
      - mailhog
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env.local # provides POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot_production
      - POSTGRES_USER=postgres

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD"']
    env_file: .env.local
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog
    ports:
      - '127.0.0.1:8025:8025'

volumes:
  storage_data:
  postgres_data:
  redis_data:
